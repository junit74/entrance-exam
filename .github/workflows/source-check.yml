name: Check admissions source access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect public source responses
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url='https://addon.jinhakapply.com/RatioV1/RatioH/Ratio30170741.html';
          const cases=[
            ['collector',{'User-Agent':'EssayAdmissionsDashboard/1.0 (public admissions statistics)','Accept':'text/html'}],
            ['browser',{'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36','Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8','Accept-Language':'ko-KR,ko;q=0.9,en;q=0.8','Referer':'https://iphak.tukorea.ac.kr/'}]
          ];
          for(const [name,headers] of cases){
            try{const r=await fetch(url,{headers,signal:AbortSignal.timeout(25000)});console.log(JSON.stringify({name,status:r.status,headers:Object.fromEntries([...r.headers].filter(([k])=>!['set-cookie'].includes(k))),body:(await r.text()).slice(0,1800)}));}
            catch(e){console.log(name,e.message);}
          }
          JS
